<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f8f5b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="밥심" />
<title>밥심</title>
<style>
:root{--g:#2f8f5b;--g2:#e8f5ee;--bg:#f6f4ef;--ink:#1f2a24;--mut:#6b766f;--warn:#b4610e;--wbg:#fff4e5;--red:#c0392b;--rbg:#fdecea;--line:#ebe7de}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#dfe7e1;color:var(--ink)}
.app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:28px}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.top h1{font-size:17px;margin:0;flex:1;display:flex;align-items:center;gap:8px}.top h1 img{width:26px;height:26px;border-radius:8px}
.top button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--mut);padding:4px}
.demo{font-size:11px;padding:3px 8px;border-radius:99px;background:#fff3d6;color:#8a5a00;display:none}
.screen{display:none;padding:10px 16px}.screen.on{display:block}
.w{background:#fff;border-radius:26px;padding:22px 18px;box-shadow:0 8px 28px rgba(31,42,36,.07);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font-size:24px;font-weight:800;margin:0 0 18px;letter-spacing:-.3px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#faf9f6;border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.opt i{font-style:normal;font-size:28px}.opt b{font-size:16px;display:block}.opt span{font-size:12px;color:var(--mut)}
.opt:active{transform:scale(.98)}.opt.pref{border-color:#bcdcc9;background:var(--g2)}
.ropt{padding:16px}.ropt b{font-size:15.5px}
.backq{border:0;background:none;color:var(--mut);font-size:13px;margin-top:14px;cursor:pointer;padding:0}
.ctx{font-size:12px;color:var(--g);font-weight:700;margin-bottom:4px}
.title{font-size:20px;font-weight:800;margin:0 0 14px;letter-spacing:-.3px}
.topk{background:var(--g2);border-radius:18px;padding:16px}
.topk .lb{font-size:11.5px;color:var(--g);font-weight:700}
.topk b{display:block;font-size:20px;margin:4px 0 6px}
.topk p,.alt p{margin:0;font-size:13px;line-height:1.55;color:#33413a}
.comp{display:inline-block;font-size:11px;background:#fff;color:var(--g);border-radius:6px;padding:1px 6px;margin-bottom:6px}
.alts{margin-top:10px}.alt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.alt b{font-size:15px}.tag{font-size:10.5px;padding:2px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.t-food{background:#eee;color:#555}.t-mfds{background:#3567b5;color:#fff}.t-otc{background:#8a5a2b;color:#fff}
.note{font-size:12px;color:var(--warn);margin-top:4px;line-height:1.5}
.ex{font-size:12.5px;color:#7a1f15;background:var(--rbg);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.55}
.ex details summary{cursor:pointer;list-style:none}.ex details summary::after{content:' ›';}
.nt{font-size:12.5px;color:#1f4d33;background:#eef6f1;border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.55}
.disc{font-size:11px;color:var(--mut);line-height:1.5;margin-top:12px}
.again{display:block;width:100%;margin-top:14px;border:1px solid #cfe3d7;background:#fff;color:var(--g);border-radius:14px;padding:12px;font-size:14px;cursor:pointer}
.stop{background:var(--rbg);color:#7a1f15;border-radius:18px;padding:16px;font-size:14px;line-height:1.6}
.lnk{display:block;text-align:center;font-size:12.5px;color:var(--mut);margin:20px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;background:none;border:0;width:100%}
h2{font-size:21px;margin:6px 0}.sub{color:var(--mut);font-size:13.5px;margin:0 0 10px;line-height:1.55}
.sec{font-size:12.5px;color:var(--mut);margin:18px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;padding:9px 13px;border:1px solid #dcd7cc;border-radius:99px;font-size:13.5px;background:#fff;cursor:pointer;user-select:none}
.chip input{display:none}.chip:has(input:checked){background:var(--g2);border-color:var(--g);color:var(--g);font-weight:700}
input[type=text]{width:100%;padding:12px 14px;border:1px solid #dcd7cc;border-radius:12px;font-size:14.5px;background:#fff;outline:none}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}
.btn.ghost{background:#fff;color:var(--g);border:1px solid #cfe3d7;margin-top:10px}
.persona{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;cursor:pointer}
.persona .e{font-size:22px}.persona b{font-size:14px}.persona div div{font-size:12px;color:var(--mut)}.persona.on{border-color:var(--g);background:var(--g2)}

.inbox{background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 8px 28px rgba(31,42,36,.07);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;margin-top:8px}
.inbox input{flex:1;border:0;outline:none;font-size:16px;padding:10px 0;min-width:0;background:transparent}
.inbox button{border:0;border-radius:14px;cursor:pointer;font-size:15px;height:42px;min-width:42px}
.cam{background:#f2f0ea}.go{background:var(--g);color:#fff;font-weight:700;padding:0 14px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 0}
.hints span{font-size:12px;color:#8a938d;border:1px dashed #d6d2c6;border-radius:99px;padding:5px 10px;cursor:pointer}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;margin-top:8px}
.sheet button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 10px;font-size:14px;cursor:pointer;border-radius:10px}
.sheet small{display:block;color:var(--mut);font-size:11.5px;padding:0 10px 6px}
.fu{position:relative;background:#fffdf6;border:1px solid #efe6cc;border-radius:16px;padding:12px 38px 12px 14px;margin-top:12px;font-size:13.5px;line-height:1.5}
.fu .x{position:absolute;right:8px;top:8px;border:0;background:none;color:#a49a80;font-size:16px;cursor:pointer}
.fu .acts{display:flex;gap:6px;margin-top:8px}.fu .acts button{border:1px solid #e6dcc0;background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.ans{margin-top:16px}
.ins{font-size:13px;color:#3b4a40;background:#f1f6f2;border-radius:12px;padding:10px 12px;line-height:1.55;margin-bottom:10px}
.pick{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
.pick .lb{font-size:11.5px;color:var(--g);font-weight:800}
.pick .nm{font-size:21px;font-weight:800;margin:4px 0 6px}
.pick p{margin:0;font-size:13.5px;line-height:1.55;color:#33413a}
.exs{font-size:12.5px;color:#7a1f15;margin-top:10px}
.cons{display:block;width:100%;margin-top:12px;border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.cons.em{background:#eef3fb;color:#24508f;text-decoration:none;border-radius:14px;padding:12px;font-weight:700}
.cons.em small{display:block;font-weight:400;font-size:11.5px;margin-top:2px}
.more{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;font-size:13.5px;color:var(--ink);cursor:pointer}
.det{margin-top:10px}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:13px;line-height:1.55}
.it b{font-size:14.5px}
.cmpbtn{border:0;background:none;color:var(--g);font-size:12.5px;padding:6px 0 0;cursor:pointer}
table.cmp{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
table.cmp th,table.cmp td{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.cmp th{color:var(--mut);font-weight:600;width:24%}
.pc{display:grid;gap:6px;margin-top:8px}
.pc div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.5}
.pc b{font-size:13px}.badge{display:inline-block;background:#eef3fb;color:#24508f;border-radius:6px;padding:1px 6px;font-size:10.5px;margin:3px 0}
.pc a{color:var(--g);cursor:pointer}.pc button{border:1px solid #cfe3d7;background:#fff;color:var(--g);border-radius:8px;padding:4px 8px;font-size:11.5px;cursor:pointer;float:right}
.demo-l{font-size:10.5px;color:#fff;background:#9a8f7a;border-radius:5px;padding:1px 6px}
.stop{margin-top:16px}
.say{font-size:15.5px;line-height:1.65;margin:0;color:var(--ink)}
.log{margin-top:22px}.log .h{font-size:12px;color:var(--mut);font-weight:700;margin:0 4px 6px}
.le{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.le .d{flex:none;width:44px;font-size:11.5px;color:var(--mut);padding-top:1px}.le .i{flex:none}
.le.need{cursor:pointer}.le.need .t::after{content:' ›';color:var(--g)}
.vd{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;margin-right:6px}
.v-ok{background:var(--g2);color:var(--g)}.v-meh{background:#fff1d6;color:#8a5a00}.v-no{background:var(--rbg);color:#7a1f15}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button id="back" style="display:none" aria-label="뒤로">‹</button>
    <h1 id="ttl"><img src="icons/icon-192.png" alt="">밥심</h1>
    <span class="demo" id="demo">데모</span>
    <button id="gear" aria-label="설정">⚙️</button>
  </div>

  <section class="screen" id="s-onboard">
    <h2>먼저, 안전하게 고르기 위한 정보</h2>
    <p class="sub">한 번만 알려주시면 맞지 않는 음식·성분을 걸러드려요. 이 기기에만 저장돼요.</p>
    <div id="pf1"></div>
    <button class="btn" id="save1">시작하기</button>
  </section>

  <section class="screen" id="s-home">
    <div class="inbox"><input id="q" placeholder="오늘 있었던 일·몸 상태를 편하게 적어 두세요" autocomplete="off"><button class="cam" id="cam" aria-label="사진">📷</button><button class="go" id="go">확인</button></div>
    <div class="sheet" id="sheet" style="display:none"><small>사진 인식은 데모예요. 샘플을 불러와요.</small>
      <button data-sample="checkup">📋 건강검진 결과지 (샘플)</button><button data-sample="meds">💊 약 봉투 (샘플)</button><button data-meal="1" style="font-size:12.5px;color:var(--mut)">🍽️ 식사 사진 남기기 (샘플 · 조용히 저장만)</button></div>
    <div class="hints" id="hints"></div>
    <div id="fus"></div>
    <div id="ans"></div>
    <div id="log"></div>
  </section>

  <section class="screen" id="s-settings">
    <h2>설정</h2>
    <p class="sub">모든 추천에 반영돼요. 이 기기(localStorage)에만 저장돼요.</p>
    <div id="pf2"></div>
    <button class="btn" id="save2">저장</button>
    <div class="sec">🎭 데모 페르소나</div>
    <div id="personas"></div>
    <button class="btn ghost" id="reset">모든 정보 지우기</button>
  </section>
</div>

<script src="engine.js"></script>
<script>
const E = window.BapsimEngine;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PKEY='bapsim.profile.v2', MKEY='bapsim.memory.v1';
const CONDS=[['pregnant','임신·수유 중'],['hypertension','고혈압'],['diabetes','당뇨'],['heart','심장질환'],['kidney','신장질환'],['thyroid','갑상선기능항진증']];
const ALLERGIES=['유제품','견과류','생선','대두','계란','국화과','감귤류'];
const PERSONAS=[
  { id:'none', e:'🙂', name:'특이사항 없음', desc:'지병·약·알레르기 없음', p:{} },
  { id:'htn', e:'🩺', name:'고혈압 · 혈압약', desc:'감초·마황 함유 한방제제 제외 · 최근 회식 기록 있음', p:{ conditions:['hypertension'], meds:'혈압약' }, notes:[[6,'팀 회식, 소주 꽤 마심'],[5,'점심 김치찌개'],[4,'거래처 회식 2차까지'],[3,'잠 못 잤음'],[2,'오늘은 일찍 퇴근'],[1,'점심 사진']] },
  { id:'preg', e:'🤰', name:'임신 중 · 유제품 알레르기', desc:'한방제제·홍삼·유제품 제외', p:{ conditions:['pregnant'], allergies:['유제품'] }, notes:[[3,'밤에 잠을 설쳤음'],[1,'잠 못 잤음']] },
  { id:'asp', e:'💊', name:'아스피린 복용', desc:'홍삼 제외 · 이번 주 야근 기록', p:{ meds:'아스피린' }, notes:[[5,'마감이라 야근'],[4,'야근 또, 저녁은 컵라면'],[3,'잠 못 잤음'],[2,'점심 거름'],[1,'야근하고 늦게 잠']] },
  { id:'fish', e:'🐟', name:'생선 알레르기 · 검진 LDL 높음', desc:'생선·오메가3 제외 · 식사 사진 몇 장 저장됨', p:{ allergies:['생선'], checkups:['lipid'] }, notes:[[6,'삼겹살 회식'],[4,'퇴근하고 치킨 시켜 먹음'],[2,'점심 샐러드']], meals:[['late','salty'],['late','salty'],['salty'],['late','salty'],['late']] },
];
const HINTS=['오늘 회식','잠 못 잤음','목 칼칼해요','검진에서 LDL 높게 나옴','요즘 변비 심해요'];
const NM=Object.fromEntries([...CONDS, ...E.CHECKUPS.map(([v,l])=>['chk:'+v,'검진 '+l])]);
const norm=p=>({ conditions:[], allergies:[], meds:'', checkups:[], demo:null, ...p });
let profile=(()=>{ try{ const p=JSON.parse(localStorage.getItem(PKEY)); return p?norm(p):null; }catch{ return null; } })();
const qs=new URLSearchParams(location.search);
const todayD=()=> qs.get('today') ? new Date(qs.get('today')+'T09:00') : new Date();   // 테스트용 날짜 지정
const dayKey=d=>d.toLocaleDateString('sv');
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
let lastQ='', lastR=null;

function saveProfile(p){ profile=norm(p); localStorage.setItem(PKEY, JSON.stringify(profile)); $('#demo').style.display=profile.demo?'inline-block':'none'; }
function summary(){ const p=profile; const a=[...p.conditions.map(c=>NM[c]), p.meds&&('약: '+p.meds), ...p.allergies.map(x=>x+' 알레르기'), ...p.checkups.map(c=>NM['chk:'+c])].filter(Boolean); return a.length?a.join(' · '):'특이사항 없음'; }
function recentMeals(m){ const today=dayKey(todayD()); return (m.meals||[]).filter(x=>{ const d=daysBetween(x.day,today); return d>=0&&d<=7; }); }
function recentEntries(m){ const today=dayKey(todayD()); return (m.entries||[]).filter(x=>{ const d=daysBetween(x.day,today); return d>=0&&d<=7; }); }
function memFor(m){ return { ...m, lastTops:(m.shown||[]).slice(-3).reverse(), seen:(m.shown||[]).reduce((o,n)=>(o[n]=(o[n]||0)+1,o),{}), lastTips:(m.tips||[]).slice(-3).reverse(), recentEntries: recentEntries(m).map(e=>({ ...e })), recentMealTags: recentMeals(m).flatMap(x=>x.tags), recentNoteTags: recentEntries(m).flatMap(x=>x.tags||[]) }; }
function mem(){ try{ return { events:[], picks:[], dismissed:[], ...(JSON.parse(localStorage.getItem(MKEY))||{}) }; }catch{ return { events:[], picks:[], dismissed:[] }; } }
function setMem(m){ localStorage.setItem(MKEY, JSON.stringify(m)); }

// ---------- 프로필 ----------
const pfHTML=x=>`<div class="sec">🤰 임신·지병</div><div class="chips">${CONDS.map(([v,l])=>`<label class="chip"><input type="checkbox" name="${x}c" value="${v}">${l}</label>`).join('')}</div>
  <div class="sec">💊 복용 중인 약</div><input type="text" id="${x}m" placeholder="없으면 비워두세요 (예: 아스피린, 혈압약)">
  <div class="sec">⚠️ 알레르기</div><div class="chips">${ALLERGIES.map(a=>`<label class="chip"><input type="checkbox" name="${x}a" value="${a}">${a}</label>`).join('')}</div>
  <div class="sec">📋 최근 건강검진 결과 <span style="font-weight:400">(선택)</span></div><div class="chips">${E.CHECKUPS.map(([v,l])=>`<label class="chip"><input type="checkbox" name="${x}k" value="${v}">${l}</label>`).join('')}</div>
  <div style="font-size:11.5px;color:var(--mut);margin-top:6px">검진 결과는 의사의 안내를 우선 따라 주세요.</div>`;
const readPF=x=>({ conditions:$$(`input[name=${x}c]:checked`).map(i=>i.value), allergies:$$(`input[name=${x}a]:checked`).map(i=>i.value), checkups:$$(`input[name=${x}k]:checked`).map(i=>i.value), meds:$('#'+x+'m').value.trim(), demo:null });
function fillPF(x){ const p=profile||norm({}); $$(`input[name=${x}c]`).forEach(i=>i.checked=p.conditions.includes(i.value)); $$(`input[name=${x}a]`).forEach(i=>i.checked=p.allergies.includes(i.value)); $$(`input[name=${x}k]`).forEach(i=>i.checked=p.checkups.includes(i.value)); $('#'+x+'m').value=p.meds; }
$('#pf1').innerHTML=pfHTML('a'); $('#pf2').innerHTML=pfHTML('b');
$('#save1').onclick=()=>{ saveProfile(readPF('a')); go('home'); };
$('#save2').onclick=()=>{ saveProfile(readPF('b')); go('home'); };
$('#reset').onclick=()=>{ localStorage.clear(); profile=null; $('#ans').innerHTML=''; go('onboard'); };
function renderPersonas(){ $('#personas').innerHTML=PERSONAS.map(x=>`<div class="persona ${profile&&profile.demo===x.id?'on':''}" data-id="${x.id}"><div class="e">${x.e}</div><div><b>${x.name}</b><div>${x.desc}</div></div></div>`).join('');
  $$('.persona').forEach(el=>el.onclick=()=>{ const x=PERSONAS.find(p=>p.id===el.dataset.id); saveProfile({ ...JSON.parse(JSON.stringify(x.p)), demo:x.id }); $('#ans').innerHTML=''; { const m=mem(); const t=todayD(); m.meals=(x.meals||[]).map((tags,i)=>({ day:dayKey(new Date(t-(i+1)*864e5)), tags })); m.entries=(m.entries||[]).filter(e=>!e.seed).concat((x.notes||[]).map(([d,text])=>({ day:dayKey(new Date(t-d*864e5)), text, kind:'note', tags:E.classify(text).tags, seed:true }))).sort((a,b)=>a.day<b.day?-1:1); setMem(m); } go('home'); }); }

// ---------- 라우팅 ----------
function go(n){
  if(!profile && n!=='onboard') n='onboard';
  $$('.screen').forEach(s=>s.classList.toggle('on', s.id==='s-'+n));
  $('#back').style.display=n==='settings'?'block':'none';
  $('#gear').style.display=n==='home'?'block':'none';
  if(n==='home'){ renderFollowups(); renderLog(); } if(n==='settings'){ fillPF('b'); renderPersonas(); }
  window.scrollTo(0,0);
}
$('#back').onclick=()=>go('home'); $('#gear').onclick=()=>go('settings');

// ---------- 입력 ----------
$('#hints').innerHTML=HINTS.map(h=>`<span>${h}</span>`).join('');
$$('#hints span').forEach(s=>s.onclick=()=>{ $('#q').value=s.textContent; $('#q').focus(); });
$('#cam').onclick=()=>{ const s=$('#sheet'); s.style.display=s.style.display==='none'?'block':'none'; };
const MEAL_TAGS=[['late','salty'],['salty'],['late'],[]];
$$('[data-meal]').forEach(b=>b.onclick=()=>{ $('#sheet').style.display='none'; const m=mem(); m.meals=(m.meals||[]).concat([{ day:dayKey(todayD()), tags:MEAL_TAGS[Math.floor(Math.random()*MEAL_TAGS.length)] }]).slice(-40); m.entries=(m.entries||[]).concat([{ day:dayKey(todayD()), text:'식사 사진', kind:'photo', tags:[] }]).slice(-80); setMem(m); toast('기록했어요'); renderLog(); });
function toast(t){ const d=document.createElement('div'); d.textContent=t; d.style.cssText='position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:.9;z-index:20'; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
$$('[data-sample]').forEach(b=>b.onclick=()=>{ $('#sheet').style.display='none'; $('#q').value=E.SAMPLES[b.dataset.sample].text; submit(); });
$('#go').onclick=()=>submit(); $('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) submit(); });

function submit(text){
  const q=(text ?? $('#q').value).trim(); if(!q) return;
  $('#hints').style.display='none';
  const m=mem(); const c=E.classify(q);
  if(!c.need){ const tip=E.noteTip(c.tags, memFor(m)); if(tip) m.tips=(m.tips||[]).concat([tip]).slice(-10); m.entries=(m.entries||[]).concat([{ day:dayKey(todayD()), text:q, kind:'note', tags:c.tags }]).slice(-80); setMem(m); $('#q').value=''; $('#ans').innerHTML=`<div class="ans"><div class="ins">📝 기록했어요${tip?' · '+esc(tip):''}</div></div>`; renderLog(); renderFollowups(); return; }
  $('#q').value=q;
  const r=E.answer(q, profile, memFor(m));
  m.entries=(m.entries||[]).concat([{ day:dayKey(todayD()), text:q, kind:'need', tags:c.tags }]).slice(-80);
  lastQ=q; lastR=r;
  if(r.type==='answer' && r.topic){ m.events.push({ day:dayKey(todayD()), topic:r.topic, text:q }); m.events=m.events.slice(-30); setMem(m); }
  if(r.top){ m.shown=(m.shown||[]).concat([r.top.name]).slice(-20); }
  setMem(m); renderAnswer(r); renderLog();
}

// ---------- 답변 카드 (짧게: 한 가지만, 나머지는 탭 뒤) ----------
const VD={'괜찮아요':'v-ok','조금 아쉬워요':'v-meh','피하는 게 좋아요':'v-no'};
const verdict=v=>v?`<span class="vd ${VD[v]}">${{'괜찮아요':'👍','조금 아쉬워요':'😐','피하는 게 좋아요':'🚫'}[v]} ${v}</span>`:'';
const insHTML=x=>`<div class="ins">${verdict(x.verdict)}${esc(x.text)}</div>`;
const kindTag=k=>k==='supp'?'<span class="tag t-mfds">식약처 인정 기능성</span>':k==='otc'?'<span class="tag t-otc">일반의약품</span>':'<span class="tag t-food">음식·차</span>';
const body=(i,k)=>k==='supp'?`“${esc(i.claim)}”`:k==='otc'?`효능·효과: ${esc(i.claim)} · 설명서 확인, 약사 상담 후 복용`:esc(i.effect);
function renderAnswer(r){
  const a=$('#ans');
  if(r.type==='stop'){ a.innerHTML=`<div class="stop">🚑 <b>${esc(r.title)}</b> ${esc(r.text)}</div>`; return; }
  let h=`<div class="ans"><div class="pick">`;
  if(r.top){ h+=`<p class="say">${(r.lines||[]).map(esc).join(' ')}</p>`; }
  else h+=`<p class="say">${esc(r.scope||r.hint||'')}</p>`;
  if(r.top){ const extra=r.consult?.emphasize?' · 약사 상담 권해요':''; h+=`<button class="more" id="more">왜 그런지 · 더 보기${extra} ▾</button>`; }
  h+=`</div>`;
  if(r.top) h+=`<div class="det" id="det" style="display:none">${detailHTML(r)}${consultBtn(r)}<div id="cbox"></div><p class="disc">ⓘ ${esc(r.disclaimer)}</p></div>`;
  h+=`</div>`;
  a.innerHTML=h;
  if($('#more')) $('#more').onclick=()=>{ const d=$('#det'); d.style.display=d.style.display==='none'?'block':'none'; };
  $$('.cmpbtn').forEach(b=>b.onclick=()=>{ const t=$('#'+b.dataset.t); t.style.display=t.style.display==='none'?'block':'none'; });
  $$('[data-pick]').forEach(b=>b.onclick=()=>{ const m=mem(); m.picks=m.picks.filter(p=>p.item!==b.dataset.item); m.picks.push({ name:b.dataset.pick, item:b.dataset.item, day:dayKey(todayD()), days:30 }); setMem(m); b.textContent='✓ 정했어요'; b.disabled=true; });
  $$('.seller').forEach(x=>x.onclick=e=>{ e.preventDefault(); alert('예시 링크예요. 실제 판매처로 연결되지 않아요.'); });
  $$('.consult').forEach(b=>b.onclick=()=>openConsult(r));
}
function detailHTML(r){
  let h='';
  if(r.trace?.length) h+=`<div class="it"><b>참고한 내 기록</b>${r.trace.map(t=>`<div style="color:var(--mut)">· ${dayLabel(t.day)} — ${esc(t.text)}</div>`).join('')}</div>`;
  if(r.insights?.length) h+=r.insights.map(insHTML).join('');
  let n=0;
  for(const g of r.groups) for(const i of g.items){
    const id='cmp'+(n++);
    h+=`<div class="it"><b>${esc(i.name)}</b>${kindTag(g.kind)}<div>${body(i,g.kind)}</div>${i.note?`<div class="note">⚠️ ${esc(i.note)}</div>`:''}
      ${i.variants?`<button class="cmpbtn" data-t="${id}">제품으로 고른다면 ›</button><div id="${id}" style="display:none">${cmpHTML(i, r.enough && g.kind==='food')}</div>`:''}</div>`;
  }
  if(r.excluded.length) h+=`<div class="it" style="border-color:#f3d2cc">${verdict('피하는 게 좋아요')}${r.excluded.map(e=>`<div style="margin-top:4px">• <b>${esc(e.name)}</b> — ${esc(e.reason)}</div>`).join('')}</div>`;
  return h;
}
function cmpHTML(i, enough){
  const v=i.variants;
  return `${enough?`<div class="nt" style="margin-top:8px">집에서 끓여 마셔도 충분해요. 굳이 사지 않아도 돼요.</div>`:''}
  <div style="margin-top:8px"><span class="demo-l">예시 데이터</span> <span style="font-size:11px;color:var(--mut)">가상의 제품·번호·가격</span></div>
  <table class="cmp"><tr><th></th>${v.items.map(p=>`<th style="color:var(--ink)">${esc(p.name)}</th>`).join('')}</tr>${v.axis.map((ax,k)=>`<tr><th>${esc(ax)}</th>${v.items.map(p=>`<td>${esc(p.vals[k])}</td>`).join('')}</tr>`).join('')}
  <tr><th>좋은 점</th>${v.items.map(p=>`<td>${esc(p.pro||'-')}</td>`).join('')}</tr><tr><th>아쉬운 점</th>${v.items.map(p=>`<td>${esc(p.con||'-')}</td>`).join('')}</tr></table>
  <div class="pc">${v.items.map(p=>`<div><button data-pick="${esc(p.name)}" data-item="${esc(i.name)}">이걸로 정했어요</button><b>${esc(p.name)}</b><br><span class="badge">✔ ${esc(p.badge)}</span><br>${esc(p.price.replace('예시가','가격(예시)'))} · <a class="seller" href="#">${esc(p.seller)}</a></div>`).join('')}</div>`;
}
function consultBtn(r){
  return r.consult?.emphasize ? `<button class="cons em consult">👩‍⚕️ 약사·영양사 상담<small>${esc(r.consult.why)}</small></button>` : `<button class="cons consult">약사·영양사에게 상담하기</button>`;
}
// ---------- 상담 (카드 안에서 바로, 목업) ----------
function openConsult(r){
  const box=$('#cbox'); if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="it" style="margin-top:8px">이 내용으로 약사·영양사에게 상담을 요청할까요? <span class="demo-l">목업</span>
    <div style="font-size:12px;color:var(--mut);margin:6px 0">“${esc(lastQ)}” · ${esc(summary())}</div>
    <button class="more" id="creq" style="margin-top:4px">상담 요청하기</button></div>`;
  $('#creq').onclick=()=>{ box.innerHTML=`<div class="nt" style="margin-top:8px">✅ 요청된 것처럼 보여주는 목업이에요. 실제로는 전송되지 않았어요.</div>`; };
}

// ---------- 맥락이 생긴 경우에만 보이는 후속 메모 ----------
function followups(){
  const m=mem(), today=dayKey(todayD()), out=[];
  const last=t=>[...m.events].reverse().find(e=>t.includes(e.topic));
  const c=last(['chill','throat']);
  if(c){ const d=daysBetween(c.day,today); if(d>=1&&d<=3) out.push({ id:'cold-'+c.day, text: c.topic==='throat'?'목은 좀 괜찮아요?':'감기 기운은 좀 괜찮아요?', acts:[['괜찮아요','dismiss'],['아직이에요','ask:'+(c.topic==='throat'?'아직 목이 칼칼해요':'아직 감기 기운이 있어요')]] }); }
  const s=last(['constipation']);
  if(s){ const d=daysBetween(s.day,today); if(d>=3&&d<=7) out.push({ id:'con-'+s.day, text:'화장실은 좀 편해졌어요?', acts:[['편해졌어요','dismiss'],['아직이에요','ask:아직 변비가 계속돼요']] }); }
  for(const p of m.picks){ const d=daysBetween(p.day,today); if(d>=p.days-5) out.push({ id:'stock-'+p.name+p.day, text:`${p.name}, 곧 떨어질 때예요.`, acts:[['다시 비교하기','ask:'+({'프로바이오틱스':'요즘 변비 심해요'}[p.item]||p.item)],['괜찮아요','dismiss']] }); }
  const re=recentEntries(m), alc=re.filter(x=>(x.tags||[]).includes('alcohol')).length;
  if(alc>=3) out.push({ id:'alc-'+today.slice(0,7)+'-'+Math.floor(+today.slice(8)/7), text:'요즘 술자리가 잦네요. 내일 아침은 맑은 국 어때요?', acts:[['알겠어요','dismiss']] });
  const rm=recentMeals(m), late=rm.filter(x=>x.tags.includes('late')).length, salty=rm.filter(x=>x.tags.includes('salty')).length;
  if(rm.length>=5 && late>=3 && salty>=3) out.push({ id:'meal-'+today.slice(0,7)+'-'+Math.floor(+today.slice(8)/7), text:'요즘 저녁이 늦고 짠 편이에요. 국물은 조금 남겨 볼까요?', acts:[['알겠어요','dismiss']] });
  return out.filter(f=>!m.dismissed.includes(f.id));
}
function renderFollowups(){
  const f=followups();
  $('#fus').innerHTML=f.map(x=>`<div class="fu" data-id="${esc(x.id)}"><button class="x" aria-label="닫기">✕</button>${esc(x.text)}<div class="acts">${x.acts.map(([l,a])=>`<button data-a="${esc(a)}">${l}</button>`).join('')}</div></div>`).join('');
  $$('.fu').forEach(el=>{ const dismiss=()=>{ const m=mem(); m.dismissed.push(el.dataset.id); setMem(m); renderFollowups(); };
    el.querySelector('.x').onclick=dismiss;
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const a=b.dataset.a; dismiss(); if(a.startsWith('ask:')) submit(a.slice(4)); }); });
}

// ---------- 기록 타임라인 (숫자·분석 없음) ----------
function dayLabel(d){ const n=daysBetween(d, dayKey(todayD())); return n<=0?'오늘':n===1?'어제':n+'일 전'; }
function renderLog(){
  const es=[...(mem().entries||[])].reverse().slice(0,30);
  if(!es.length){ $('#log').innerHTML=''; return; }
  const ic={ note:'📝', need:'💬', photo:'🍽️' };
  $('#log').innerHTML=`<div class="log"><div class="h">내 기록</div>${es.map((e,i)=>`<div class="le ${e.kind==='need'?'need':''}" data-i="${i}"><span class="d">${dayLabel(e.day)}</span><span class="i">${ic[e.kind]||'📝'}</span><span class="t">${esc(e.text)}</span></div>`).join('')}</div>`;
  $$('.le.need').forEach(el=>el.onclick=()=>{ const e=es[+el.dataset.i]; $('#q').value=e.text; const r=E.answer(e.text, profile, memFor(mem())); lastQ=e.text; lastR=r; renderAnswer(r); window.scrollTo({top:0,behavior:'smooth'}); });
}

// ---------- PWA ----------
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(profile) saveProfile(profile); else $('#demo').style.display='none';
go(profile?'home':'onboard');
</script>
</body>
