<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>밥심 B · 위젯 우선</title>
<style>
body{margin:0;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;background:linear-gradient(160deg,#7aa6c2,#c9b6d9 60%,#f1c9b0);color:#fff}
.sb{display:flex;justify-content:space-between;padding:10px 22px;font-size:13px;font-weight:600}
.wg{margin:18px 18px 10px;background:rgba(255,255,255,.92);color:#1f2a24;border-radius:24px;padding:14px;display:flex;gap:12px;align-items:stretch;min-height:130px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.wg .cam{flex:0 0 96px;border:0;border-radius:18px;background:#2f8f5b;color:#fff;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.wg .cam small{font-size:11px}
.wg .slot{flex:1;font-size:13px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;position:relative}
.wg .slot .tr{font-size:10.5px;color:#6b766f;margin-top:4px}.wg .slot .x{position:absolute;top:-6px;right:-4px;border:0;background:none;color:#aaa;font-size:14px}
.wg .slot .quiet{color:#8a948e;font-size:12.5px}.wg .lab{font-size:10.5px;color:#2f8f5b;font-weight:700;margin-bottom:2px}
.wname{text-align:center;font-size:11px;margin-bottom:14px;opacity:.9}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding:0 14px}.ic{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:4px}.ic i{font-style:normal;width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:28px}
.ic.bap i{background:#2f8f5b}
.pick{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#1f2a24;border-radius:20px 20px 0 0;padding:14px 14px 50px;display:none;z-index:45}.pick small{color:#6b766f}
.pick .g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.pick .g button{border:1px solid #eee;background:#fafafa;border-radius:12px;font-size:24px;padding:6px 0}
.app{position:fixed;inset:0;background:#f6f4ef;color:#1f2a24;display:none;overflow:auto;padding:16px 16px 60px;z-index:42}.app h3{margin:6px 0}.row{font-size:13px;padding:6px 0;border-bottom:1px solid #ebe7de}
.app input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:14px;margin:8px 0}
</style></head><body>
<div class="sb"><span>9:41</span><span>●●● 🔋</span></div>
<div class="wg"><button class="cam" id="cam">📷<small>찍어 두기</small></button><div class="slot" id="slot"></div></div>
<div class="wname">밥심</div>
<div class="icons"><div class="ic"><i>📞</i>전화</div><div class="ic"><i>💬</i>메시지</div><div class="ic"><i>📷</i>카메라</div><div class="ic"><i>🗓️</i>캘린더</div>
<div class="ic"><i>🎵</i>음악</div><div class="ic"><i>🗺️</i>지도</div><div class="ic bap" id="openapp"><i>🍚</i>밥심</div><div class="ic"><i>⚙️</i>설정</div></div>
<div class="pick" id="pick"><small>데모: 찍은 사진 대신 샘플을 골라요. 분석 없이 저장만 돼요.</small><div class="g" id="g"></div></div>
<div class="app" id="app"><button id="close" style="border:0;background:none;font-size:14px;color:#2f8f5b">‹ 홈 화면</button><h3>밥심</h3><input id="q" placeholder="한 줄 메모나 궁금한 것 (선택)"><div id="rows"></div></div>
<script src="../engine.js"></script><script src="../proto/shared.js"></script>
<script>
const B=Bapsim, st=B.Store('b'), $=s=>document.querySelector(s);
function render(){
  const n=B.nudge(st);
  $('#slot').innerHTML=n?`<button class="x" aria-label="닫기">✕</button><div class="lab">${n.kind==='catch'?'잠깐만요':'오늘'}</div><div id="nt">${B.esc(n.text)}</div><div class="tr">📷 ${B.esc(n.trace)}</div>`:'<div class="quiet">오늘은 짚어 드릴 게 없어요.<br>찍어 두기만 하세요.</div>';
  if(n){ $('#slot .x').onclick=e=>{ e.stopPropagation(); st.dismiss(n.id); render(); }; $('#nt').onclick=()=>B.openSheet(`<p style="font-size:12px;color:#6b766f">${B.esc(n.tap.label)}</p>`+B.detailHTML(n.tap.q, st)); }
  $('#rows').innerHTML=st.visible().slice().reverse().map(e=>`<div class="row">${B.dayLabel(e.day,st.today())} · ${e.snap?B.SNAPS[e.snap].e:'📝'} ${B.esc(e.text)}</div>`).join('');
}
$('#g').innerHTML=Object.entries(B.SNAPS).map(([k,s])=>`<button data-k="${k}" title="${s.l}">${s.e}</button>`).join('');
$('#cam').onclick=()=>{ const p=$('#pick'); p.style.display=p.style.display==='block'?'none':'block'; };
document.querySelectorAll('#g button').forEach(b=>b.onclick=()=>{ st.snap(b.dataset.k); $('#pick').style.display='none'; B.toast('밥심에 저장했어요'); render(); });
$('#openapp').onclick=()=>$('#app').style.display='block'; $('#close').onclick=()=>$('#app').style.display='none';
$('#q').onkeydown=e=>{ if(e.key!=='Enter'||e.isComposing) return; const v=e.target.value.trim(); if(!v) return; const need=st.memo(v); e.target.value=''; if(need) B.openSheet(B.detailHTML(v, st)); else B.toast('저장했어요'); render(); };
B.demoBar(st, render); render();
</script></body></html>
