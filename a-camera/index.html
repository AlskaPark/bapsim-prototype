<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="robots" content="noindex"><link rel="stylesheet" href="../proto/ui.css"><script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script><title>밥심 A · 카메라 우선</title>
<style>
body{background:#000;color:#fff;overflow:hidden;height:100vh}
.vf{position:fixed;inset:0;background:url(../img/vf-dosirak.jpg) center/cover;filter:saturate(1.05)}
.vf::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7))}
.focus{position:fixed;left:50%;top:44%;width:88px;height:88px;transform:translate(-50%,-50%);border:1.5px solid rgba(255,214,10,.9);border-radius:4px;opacity:.9}
#nud{position:fixed;top:62px;left:16px;right:16px;z-index:10}
.bottom{position:fixed;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:10}
.modes{display:flex;gap:22px;font-size:13px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.6)}.modes .on{color:#FFD60A}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 36px}
.thumb{width:44px;height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.9);background:#222 center/cover;overflow:hidden}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:3px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .15s}.shutter:active span{transform:scale(.9)}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:center}
.memo{width:calc(100% - 48px);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);border-radius:999px;padding:6px 6px 6px 16px}
.memo input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:14px;outline:none}.memo input::placeholder{color:rgba(255,255,255,.6)}
.memo button{white-space:nowrap;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#18181B;padding:7px 14px;font-size:13px;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;width:100%;padding:0 24px;scrollbar-width:none;animation:nIn .3s var(--ease) both}
.strip button{flex:0 0 auto;width:60px;height:60px;border-radius:14px;border:2px solid rgba(255,255,255,.85);background:#222 center/cover;padding:0}
.strip-l{font-size:12px;color:rgba(255,255,255,.7)}
.handle{display:flex;flex-direction:column;align-items:center;border:0;background:none;color:rgba(255,255,255,.75);font-size:12px;font-weight:500}.handle svg{width:18px;height:18px}
.tl{position:fixed;left:0;right:0;bottom:0;height:78vh;background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .38s var(--ease);overflow:auto;padding:12px 20px 100px;z-index:30}
.tl.on{transform:none}.tl .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.tl h3{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em}.tl .s{font-size:13px;color:var(--sub);margin-bottom:12px}
.day{font-size:13px;font-weight:600;color:var(--sub);margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph{aspect-ratio:1;border-radius:14px;background:#ddd center/cover;position:relative;overflow:hidden}
.ph span{position:absolute;left:8px;bottom:6px;font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.nt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;margin-bottom:6px;box-shadow:var(--sh-1)}.nt svg{width:16px;height:16px;color:var(--faint)}
</style></head><body>
<div class="vf"></div><video id="live" playsinline muted autoplay style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video><div class="focus"></div>
<div id="sb"></div>
<div id="nud"></div>
<div class="bottom">
  <div class="modes"><span>메모</span><span class="on">사진</span></div>
  <div class="row"><div class="thumb" id="last"></div><button class="shutter" id="shutter" aria-label="찍기"><span></span></button><button class="ib" id="h" aria-label="기록"><i data-lucide="layout-grid"></i></button></div>
  <div class="memo"><input id="q" placeholder="한 줄 메모 (선택)"><button id="go">저장</button></div>
</div>
<div class="tl" id="tl"></div><div class="homebar light"></div>
<script src="../engine.js"></script><script src="../proto/shared.js"></script>
<script>
const B=Bapsim, st=B.Store('a'), $=s=>document.querySelector(s);
$('#sb').innerHTML=B.statusBar(true);
function render(){
  const n=B.nudge(st);
  $('#nud').innerHTML=n?B.nudgeHTML(n):''; if(n) B.bindNudge($('#nud'), n, st, render);
  const ph=st.visible().filter(e=>e.kind==='photo'); const lp=ph[ph.length-1]; $('#last').style.backgroundImage=lp?`url(${B.src(lp)})`:'';
  const by={}; st.visible().slice().reverse().forEach(e=>{ (by[e.day]=by[e.day]||[]).push(e); });
  $('#tl').innerHTML='<div class="grab"></div><h3>내 기록</h3><div class="s">찍어 둔 것만 모여 있어요. 따로 정리할 건 없어요.</div>'+Object.entries(by).map(([d,es])=>`<div class="day">${B.dayLabel(d,st.today())}</div>${es.filter(e=>e.kind!=='photo').map(e=>`<div class="nt"><i data-lucide="pen-line"></i>${B.esc(e.text)}</div>`).join('')}<div class="grid">${es.filter(e=>e.kind==='photo').map(e=>`<div class="ph" style="background-image:url(${B.src(e)})"><span>${B.esc(e.text)}</span></div>`).join('')}</div>`).join('');
  B.icons();
}
let stream=null;
if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&!navigator.webdriver){ navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false }).then(s=>{ stream=s; const v=$('#live'); v.srcObject=s; v.style.display='block'; }).catch(()=>{}); }
$('#shutter').onclick=async()=>{
  if(!stream) return B.capture(st, render);
  const v=$('#live'), c=document.createElement('canvas'); const k=Math.min(1,1080/Math.max(v.videoWidth,v.videoHeight)); c.width=v.videoWidth*k; c.height=v.videoHeight*k; c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); document.body.animate([{opacity:.4},{opacity:1}],{duration:180});
  await B.saveBlob(st, blob, render);
};
$('#go').onclick=()=>{ const v=$('#q').value.trim(); if(!v) return; const need=st.memo(v); $('#q').value=''; if(need) B.openSheet(B.detailHTML(v, st)); else B.toast('저장했어요'); render(); };
$('#h').onclick=()=>$('#tl').classList.toggle('on'); $('#tl').onclick=e=>{ if(e.target.classList.contains('grab')||e.target.tagName==='H3') $('#tl').classList.remove('on'); };
let y0=null; document.addEventListener('touchstart',e=>y0=e.touches[0].clientY); document.addEventListener('touchend',e=>{ if(y0!==null && y0-e.changedTouches[0].clientY>60) $('#tl').classList.add('on'); if(y0!==null && e.changedTouches[0].clientY-y0>60) $('#tl').classList.remove('on'); y0=null; });
B.demoBar(st, render); B.ready(st).then(()=>{ render(); B.onboard(st, render); });
</script></body></html>
