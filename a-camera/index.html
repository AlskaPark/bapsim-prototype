<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>밥심 A · 카메라 우선</title>
<style>
body{margin:0;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#000;color:#fff;overflow:hidden}
.vf{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#3b4a40,#0d1210 70%)}
.vf .ghost{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:110px;opacity:.18}
.frame{position:absolute;inset:18% 10% 34% 10%;border:2px solid rgba(255,255,255,.25);border-radius:24px}
.nudge{position:absolute;top:14px;left:12px;right:12px;background:rgba(255,255,255,.95);color:#1f2a24;border-radius:16px;padding:12px 36px 12px 14px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.nudge .tr{font-size:11.5px;color:#6b766f;margin-top:4px}.nudge .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:16px;color:#999}
.nudge .tap{margin-top:6px;border:0;background:none;color:#2f8f5b;font-size:13px;padding:0}
.bottom{position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:12px}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}
.memo{width:78%;display:flex;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 4px 4px 14px}
.memo input{flex:1;background:none;border:0;color:#fff;font-size:13px;outline:none}.memo input::placeholder{color:rgba(255,255,255,.6)}.memo button{border:0;border-radius:99px;background:rgba(255,255,255,.25);color:#fff;padding:6px 10px;font-size:12px}
.strip{display:flex;gap:8px;overflow-x:auto;width:100%;padding:0 12px;box-sizing:border-box}.strip button{flex:0 0 auto;width:56px;height:56px;border-radius:14px;border:0;background:rgba(255,255,255,.18);font-size:26px}
.handle{font-size:11px;color:rgba(255,255,255,.7);border:0;background:none}
.tl{position:fixed;left:0;right:0;bottom:0;height:72vh;background:#f6f4ef;color:#1f2a24;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .25s;overflow:auto;padding:14px 16px 60px;z-index:30}
.tl.on{transform:none}.tl h3{margin:4px 0 8px;font-size:15px}.day{font-size:12px;color:#6b766f;margin:12px 0 6px}.ph{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;margin:0 6px 6px 0;border-radius:14px;background:#fff;border:1px solid #ebe7de;font-size:26px}.ph span{font-size:10px;color:#6b766f}
.nt{display:block;font-size:12.5px;color:#444;margin:2px 0 6px}
</style></head><body>
<div class="vf"><div class="ghost">🍽️</div><div class="frame"></div></div>
<div id="nud"></div>
<div class="bottom"><div class="strip" id="strip" style="display:none"></div><button class="shutter" id="shutter" aria-label="찍기"></button>
<div class="memo"><input id="q" placeholder="한 줄 메모 (선택)"><button id="go">저장</button></div><button class="handle" id="h">▴ 기록 보기</button></div>
<div class="tl" id="tl"></div>
<script src="../engine.js"></script><script src="../proto/shared.js"></script>
<script>
const B=Bapsim, st=B.Store('a'), $=s=>document.querySelector(s);
function render(){
  const n=B.nudge(st);
  $('#nud').innerHTML=n?`<div class="nudge" id="nc"><button class="x" aria-label="닫기">✕</button>${B.esc(n.text)}<div class="tr">📷 ${B.esc(n.trace)}</div><button class="tap">${B.esc(n.tap.label)} ›</button></div>`:'';
  if(n){ $('#nc .x').onclick=()=>{ st.dismiss(n.id); render(); }; $('#nc .tap').onclick=()=>B.openSheet(B.detailHTML(n.tap.q, st)); }
  const by={}; st.visible().slice().reverse().forEach(e=>{ (by[e.day]=by[e.day]||[]).push(e); });
  $('#tl').innerHTML='<h3>내 기록</h3>'+Object.entries(by).map(([d,es])=>`<div class="day">${B.dayLabel(d,st.today())}</div>${es.map(e=>e.kind==='photo'?`<span class="ph">${B.SNAPS[e.snap].e}<span>${B.esc(e.text)}</span></span>`:`<span class="nt">📝 ${B.esc(e.text)}</span>`).join('')}`).join('');
}
$('#strip').innerHTML=Object.entries(B.SNAPS).map(([k,s])=>`<button data-k="${k}" title="${s.l}">${s.e}</button>`).join('');
$('#shutter').onclick=()=>{ const s=$('#strip'); s.style.display=s.style.display==='none'?'flex':'none'; };
document.querySelectorAll('#strip button').forEach(b=>b.onclick=()=>{ st.snap(b.dataset.k); $('#strip').style.display='none'; B.toast('저장했어요'); render(); });
$('#go').onclick=()=>{ const v=$('#q').value.trim(); if(!v) return; const need=st.memo(v); $('#q').value=''; if(need) B.openSheet(B.detailHTML(v, st)); else B.toast('저장했어요'); render(); };
$('#h').onclick=()=>$('#tl').classList.toggle('on'); $('#tl').onclick=e=>{ if(e.target.tagName==='H3') $('#tl').classList.remove('on'); };
let y0=null; document.addEventListener('touchstart',e=>y0=e.touches[0].clientY); document.addEventListener('touchend',e=>{ if(y0!==null && y0-e.changedTouches[0].clientY>60) $('#tl').classList.add('on'); if(y0!==null && e.changedTouches[0].clientY-y0>60) $('#tl').classList.remove('on'); y0=null; });
B.demoBar(st, render); render();
</script></body></html>
