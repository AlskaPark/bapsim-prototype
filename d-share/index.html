<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="stylesheet" href="../proto/ui.css"><script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="../proto/notif.css"><title>밥심 D · 공유하기로 저장</title>
<style>
body{background:#000;color:#fff;min-height:100vh;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;font-size:16px}.hd .l{display:flex;align-items:center;color:#0A84FF}.hd .c{text-align:center;font-size:14px;font-weight:600;line-height:1.2}.hd .c small{display:block;font-weight:400;color:rgba(255,255,255,.6);font-size:12px}.hd .r{color:#0A84FF;font-size:15px}
.photo{margin-top:40px;height:420px;background:#111 center/cover;transition:background-image .2s}
.thumbs{display:flex;gap:2px;overflow-x:auto;padding:24px 0 0;scrollbar-width:none;justify-content:flex-start}.thumbs button{flex:0 0 auto;width:36px;height:52px;border:0;padding:0;background:#222 center/cover;opacity:.7}.thumbs button.on{width:52px;opacity:1;margin:0 4px}
.tb{position:fixed;left:0;right:0;bottom:72px;display:flex;justify-content:space-around;align-items:center}.tb button,.tb span{border:0;background:none;color:#0A84FF;display:flex}.tb svg{width:24px;height:24px}
.share{position:fixed;left:0;right:0;bottom:0;background:#F2F2F7;color:var(--ink);border-radius:14px 14px 0 0;padding:16px 16px 110px;display:none;z-index:45;animation:up .32s var(--ease) both}
.share .hdr{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:.5px solid rgba(60,60,67,.2)}.share .hdr img{width:52px;height:52px;border-radius:10px;object-fit:cover}.share .hdr b{font-size:15px}.share .hdr small{display:block;color:var(--sub);font-size:13px}
.share .apps{display:flex;gap:18px;overflow-x:auto;padding:16px 2px;scrollbar-width:none}.share .a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;min-width:64px;color:var(--ink2)}
.share .a i{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}.share .a i svg{width:28px;height:28px}
.share .rows div{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:13px 16px;font-size:16px}.share .rows div:first-child{border-radius:12px 12px 0 0;border-bottom:.5px solid rgba(60,60,67,.2)}.share .rows div:last-child{border-radius:0 0 12px 12px}.share .rows svg{width:20px;height:20px;color:var(--ink2)}
.banner{position:fixed;top:54px;left:0;right:0;z-index:50;display:flex;justify-content:center}
.mini{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:none;overflow:auto;padding:0 20px 110px;z-index:44;animation:fade .2s both}.mini .top{height:44px;display:flex;align-items:center}.mini .top button{border:0;background:none;color:var(--accent-ink);font-weight:600;display:flex;align-items:center}
.mini h3{margin:8px 0 16px;font-size:26px;font-weight:700;letter-spacing:-.02em}.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}.row img,.row .mi{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--faint)}.row .d{margin-left:auto;font-size:12.5px;color:var(--faint)}
</style></head><body>
<div id="sb"></div>
<div class="hd"><span class="l"><i data-lucide="chevron-left"></i>앨범</span><span class="c" id="cap">오늘<small>오후 3:10</small></span><span class="r" id="openbap">밥심</span></div>
<div class="photo" id="photo" style="background-image:url(../img/coffee.jpg)"></div>
<div class="thumbs" id="th"></div>
<div class="tb"><button id="sh" aria-label="공유"><i data-lucide="share"></i></button><span><i data-lucide="heart"></i></span><span><i data-lucide="info"></i></span><span><i data-lucide="trash-2"></i></span></div>
<div class="share" id="share"><div class="hdr"><img id="shimg" src="../img/coffee.jpg" alt=""><div><b>사진 1장</b><small>옵션</small></div></div>
<div class="apps"><div class="a"><i style="background:linear-gradient(#5BF675,#2BC94B)"><i data-lucide="message-circle"></i></i>메시지</div><div class="a"><i style="background:linear-gradient(#1E90FF,#0A6CF0)"><i data-lucide="mail"></i></i>메일</div><div class="a" id="tobap"><i style="background:linear-gradient(#F0905A,#E06A2E)"><i data-lucide="soup"></i></i>밥심</div><div class="a"><i style="background:linear-gradient(#FFD15C,#F5A623)"><i data-lucide="sticky-note"></i></i>메모</div><div class="a"><i style="background:linear-gradient(#8E8E93,#636366)"><i data-lucide="more-horizontal"></i></i>더 보기</div></div>
<div class="rows"><div>복사하기<i data-lucide="copy"></i></div><div>앨범에 추가<i data-lucide="folder-plus"></i></div></div></div>
<div class="banner" id="ban"></div>
<div class="mini" id="mini"><div id="sb2"></div><div class="top"><button id="mclose"><i data-lucide="chevron-left"></i>닫기</button></div><h3>밥심</h3><div id="rows"></div></div>
<div class="homebar light"></div>
<script src="../engine.js"></script><script src="../proto/shared.js"></script>
<script>
const B=Bapsim, st=B.Store('d'), $=s=>document.querySelector(s); let cur='coffee';
$('#sb').innerHTML=B.statusBar(true); $('#sb2').innerHTML=B.statusBar(false);
$('#th').innerHTML=Object.entries(B.SNAPS).map(([k,s])=>`<button data-k="${k}" aria-label="${s.l}" class="${k===cur?'on':''}" style="background-image:url(${B.IMG(k)})"></button>`).join('');
document.querySelectorAll('#th button').forEach(b=>b.onclick=()=>{ cur=b.dataset.k; $('#photo').style.backgroundImage=`url(${B.IMG(cur)})`; $('#shimg').src=B.IMG(cur); document.querySelectorAll('#th button').forEach(x=>x.classList.toggle('on',x===b)); });
$('#sh').onclick=()=>$('#share').style.display='block';
$('#share').onclick=e=>{ if(e.target===$('#share')) $('#share').style.display='none'; };
$('#tobap').onclick=()=>{ $('#share').style.display='none'; B.capture(st, render, { multiple:true }); };
function render(){
  const n=B.nudge(st);
  $('#ban').innerHTML=n?`<div class="noti" id="noti"><div class="hd"><span class="ai"><i data-lucide="soup"></i></span><b>밥심</b><span>지금</span></div><div class="m">${B.esc(n.text)}</div>${B.traceHTML(n.trace)}<button class="x" aria-label="닫기"><i data-lucide="x"></i></button></div>`:'';
  if(n){ $('#noti .x').onclick=e=>{ e.stopPropagation(); $('#noti').classList.add('out'); setTimeout(()=>{ st.dismiss(n.id); render(); },260); }; $('#noti').onclick=()=>B.openSheet(B.detailHTML(n.tap.q, st)); }
  $('#rows').innerHTML=st.visible().slice().reverse().map(e=>`<div class="row">${B.src(e)?`<img src="${B.src(e)}" alt="">`:'<span class="mi"><i data-lucide="pen-line"></i></span>'}${B.esc(e.text)}<span class="d">${B.dayLabel(e.day,st.today())}</span></div>`).join('');
  B.icons();
}
$('#openbap').onclick=()=>$('#mini').style.display='block'; $('#mclose').onclick=()=>$('#mini').style.display='none';
B.demoBar(st, render); B.ready(st).then(()=>{ render(); B.onboard(st, render); });
</script></body></html>
